<script>

/* =========================================================
   DASHBOARD TITLES - REVERSED ORDER
   ========================================================= */

const titles = [

    "Account & Treasury - All Dashboard Graph Details",

    "Department IT - Desk Ticket Details",

    "Department Legal - Contract Request Database",

    "Department Supply Chain - Goal Details",

    "Department Supply Chain - Goal Shipping Status",

    "Department Compliance - Status",

    "Department Legal - Document Collection Status",

    "Department BD - L Towers",

    "Department HR - Site Visit",

    "Immigration - Biometric",

    "Employee Database",

    "Timesheet"

];


/* =========================================================
   GET ALL DASHBOARDS
   ========================================================= */

const frames = document.querySelectorAll("iframe");


/* =========================================================
   SETTINGS
   ========================================================= */

const SWITCH_TIME = 170;

let current = 0;

let remaining = SWITCH_TIME;


/* =========================================================
   SHOW DASHBOARD
   ========================================================= */

function showDashboard(index) {

    frames.forEach(frame => {
        frame.classList.remove("active");
    });

    frames[index].classList.add("active");

    document.getElementById("title").textContent =
        titles[index];

    current = index;

    remaining = SWITCH_TIME;

    document.getElementById("count").textContent =
        remaining;
}


/* =========================================================
   COUNTDOWN + AUTO SWITCH
   ========================================================= */

setInterval(() => {

    remaining--;

    document.getElementById("count").textContent =
        remaining;

    if (remaining <= 0) {

        const nextDashboard =
            (current + 1) % frames.length;

        showDashboard(nextDashboard);

    }

}, 1000);


/* =========================================================
   FULLSCREEN ON FIRST CLICK
   ========================================================= */

document.addEventListener("click", () => {

    if (!document.fullscreenElement) {

        document.documentElement
            .requestFullscreen()
            .catch(() => {});

    }

}, { once: true });


/* =========================================================
   START
   ========================================================= */

showDashboard(0);

</script>
